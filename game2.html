<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>재미있는 카드 뒤집기 게임</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --primary-bg: #f0f4f8;
            --text-color: #37474f;
            --card-back-bg: #ab47bc;
            --card-back-shadow: #7b1fa2;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--primary-bg);
            background-image: radial-gradient(#e1e8ed 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding: 0 0 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 📌 상단 네비게이션 */
        .top-nav {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            z-index: 100;
            padding: 12px 0;
            margin-bottom: 20px;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.1em;
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
            cursor: pointer;
            border: none;
            font-family: 'Jua', sans-serif;
        }

        .nav-btn.home { background-color: #78909c; }
        .nav-btn.reset { background-color: #ff9800; }
        .nav-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }

        /* 타이틀 및 현황판 */
        h1 {
            font-size: 2.3em;
            color: #263238;
            margin: 10px 0 15px 0;
            text-shadow: 2px 2px 0px #fff, 3px 3px 0px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            font-size: 1.2em;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-item span {
            color: #ab47bc;
            font-weight: bold;
        }

        /* 🎴 카드 그리드 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 480px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg) scale(0.95);
            opacity: 0.7;
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8em;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border: 3px solid white;
        }

        /* 카드 뒷면 (숨겨졌을 때) */
        .card-back {
            background-color: var(--card-back-bg);
            box-shadow: inset 0 -6px 0 var(--card-back-shadow), 0 8px 15px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .card-back::after {
            content: '❓';
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* 카드 앞면 (뒤집혔을 때) */
        .card-front {
            background-color: #ffffff;
            transform: rotateY(180deg);
            border: 3px solid #e1bee7;
        }

        /* 🎉 성공 축하 팝업 Overlay */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .popup-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-card {
            background: white;
            padding: 35px 25px;
            border-radius: 35px;
            text-align: center;
            max-width: 360px;
            width: 85%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-card h2 {
            font-size: 2.2em;
            color: #ab47bc;
            margin: 0 0 10px 0;
        }

        .popup-card p {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 25px;
        }

        .popup-btn {
            background-color: #ab47bc;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            border-radius: 30px;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            box-shadow: 0 5px 0 #7b1fa2;
        }

        .popup-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7b1fa2;
        }

        @media (max-width: 400px) {
            .game-grid { gap: 8px; }
            .card-face { font-size: 2.2em; border-radius: 15px; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>

<body>

    <!-- 상단 네비게이션 -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-btn home">🏠 메인</a>
            <button class="nav-btn reset" onclick="initGame()">🔄 다시하기</button>
        </div>
    </nav>

    <h1>🃏 동물 짝맞추기 게임</h1>

    <!-- 점수 및 상태 표시 -->
    <div class="stats-bar">
        <div class="stat-item">시도: <span id="tries-count">0</span>회</div>
        <div class="stat-item">남은 짝: <span id="pairs-left">8</span>개</div>
    </div>

    <!-- 카드 보드 -->
    <div class="game-grid" id="game-grid"></div>

    <!-- 축하 팝업 -->
    <div class="popup-overlay" id="success-popup">
        <div class="popup-card">
            <div style="font-size: 80px; margin-bottom: 10px;">🎉🏆🎉</div>
            <h2>참 잘했어요!</h2>
            <p id="popup-desc">총 0번 만에 모두 맞추었어요!</p>
            <button class="popup-btn" onclick="initGame()">한 번 더 하기!</button>
        </div>
    </div>

    <script>
        const EMOJIS = ['🐶', '🐱', '🦁', '🐵', '🐰', '🦊', '🐼', '🐸'];
        
        let cards = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let tries = 0;
        let matchedPairs = 0;

        // AudioContext 단일 인스턴스 재사용
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 효과음 재생
        function playSound(type) {
            try {
                const ctx = getAudioContext();

                if (type === 'flip') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'match') {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.2);
                        o.start(ctx.currentTime + i * 0.08);
                        o.stop(ctx.currentTime + i * 0.08 + 0.2);
                    });
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.3);
                        o.start(ctx.currentTime + i * 0.12);
                        o.stop(ctx.currentTime + i * 0.12 + 0.3);
                    });
                }
            } catch(e) {}
        }

        // 게임 초기화
        function initGame() {
            const grid = document.getElementById('game-grid');
            document.getElementById('success-popup').classList.remove('show');
            
            grid.innerHTML = '';
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            tries = 0;
            matchedPairs = 0;

            document.getElementById('tries-count').innerText = tries;
            document.getElementById('pairs-left').innerText = EMOJIS.length;

            cards = [...EMOJIS, ...EMOJIS];
            cards.sort(() => Math.random() - 0.5);

            cards.forEach((emoji, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.emoji = emoji;
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${emoji}</div>
                `;

                cardEl.addEventListener('click', flipCard);
                grid.appendChild(cardEl);
            });
        }

        // 카드 뒤집기 동작
        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;
            if (this.classList.contains('matched')) return;

            playSound('flip');
            this.classList.add('flipped');

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            tries++;
            document.getElementById('tries-count').innerText = tries;

            checkMatch();
        }

        // 일치 여부 확인
        function checkMatch() {
            const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        // 짝이 맞았을 때
        function disableCards() {
            lockBoard = true; // 매칭 처리 중 추가 클릭 방지

            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matchedPairs++;
            document.getElementById('pairs-left').innerText = EMOJIS.length - matchedPairs;

            playSound('match');

            setTimeout(() => {
                resetBoard();
                if (matchedPairs === EMOJIS.length) {
                    playSound('win');
                    document.getElementById('popup-desc').innerText = `총 ${tries}번 만에 모든 동물 짝을 찾았어요!`;
                    document.getElementById('success-popup').classList.add('show');
                }
            }, 300);
        }

        // 짝이 틀렸을 때 (다시 뒤집기)
        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 800);
        }

        // 선택 상태 초기화
        function resetBoard() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }

        window.onload = initGame;
    </script>
</body>

</html>
