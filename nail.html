<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반짝반짝 리얼 네일아트 놀이</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* S25 화면에서 페이지 전체 스크롤 완전 차단 */
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #ffeaa7, #ffc0cb);
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* 상단 헤더 */
        .header-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 8px 12px 2px 12px;
            flex-shrink: 0;
        }

        h2 {
            margin: 0;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
            font-size: 19px;
            white-space: nowrap;
        }

        .home-btn {
            position: absolute;
            left: 12px;
            background: white;
            border: none;
            border-radius: 16px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 메인 게임 컨테이너 (S25 화면 폭 400px 내외에 맞춤) */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 430px;
            height: calc(100dvh - 36px);
            padding: 4px 10px 10px 10px;
            gap: 6px;
            overflow: hidden;
        }

        /* 1. 상단 툴바 */
        .left-menu {
            display: flex;
            flex-direction: row;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid white;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            flex-shrink: 0;
        }

        .btn.active {
            border-color: #e84393;
            transform: scale(1.06);
            background-color: #fff0f6;
        }

        .slider-box {
            background: white;
            padding: 0 10px;
            height: 52px;
            border-radius: 26px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .slider-box span {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .size-slider {
            width: 80px;
            height: 16px;
            accent-color: #e84393;
            cursor: pointer;
        }

        /* 2. 중앙 손톱 캔버스 (S25 화면 높이에 따라 자동 반응) */
        .artboard {
            position: relative;
            width: 100%;
            max-width: 350px;
            flex: 1;
            max-height: 48dvh;
            aspect-ratio: 450 / 550;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            flex-shrink: 1;
            touch-action: none;
            margin: 0 auto;
        }

        #nailBackground {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffffff, #f7d6e0);
            transition: background 0.25s ease;
        }

        #paintCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            touch-action: none;
        }

        .finger-overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 3. 하단 메뉴 패널 */
        .right-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 12px;
            border-radius: 22px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            width: 100%;
            flex-shrink: 0;
        }

        .menu-column {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .column-title {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            text-align: left;
            padding-left: 2px;
        }

        .color-row, .sticker-slider {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px;
            touch-action: pan-x;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .color-row::-webkit-scrollbar, .sticker-slider::-webkit-scrollbar {
            display: none; /* 모바일에서 깔끔하게 스크롤바 숨김 */
        }

        .right-menu .btn {
            width: 54px;
            height: 54px;
            font-size: 26px;
            border-width: 3px;
            scroll-snap-align: start;
        }

        .pen-color-btn.selected {
            border: 4px solid #e84393;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(232, 67, 147, 0.5);
        }

        .sticker-item {
            cursor: grab;
        }

        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            user-select: none;
            will-change: left, top;
        }

        /* PC / 대형 화면 분기 처리 */
        @media (min-width: 769px) {
            html, body {
                justify-content: center;
                padding: 10px;
            }
            .header-bar {
                max-width: 900px;
            }
            .game-container {
                flex-direction: row;
                max-width: 900px;
                height: 560px;
                gap: 16px;
            }
            .left-menu {
                flex-direction: column;
                width: auto;
            }
            .slider-box {
                flex-direction: column;
                height: auto;
                padding: 10px;
                border-radius: 20px;
            }
            .size-slider {
                writing-mode: vertical-lr;
                direction: rtl;
                width: 16px;
                height: 90px;
            }
            .artboard {
                height: 100%;
                max-height: none;
            }
            .right-menu {
                width: 300px;
                height: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <a href="index.html" class="home-btn">🏠 홈</a>
        <h2>💅 반짝반짝 모바일 네일 숍</h2>
    </div>

    <div class="game-container">
        <!-- 1. 상단 기능 툴바 -->
        <div class="left-menu">
            <button class="btn" style="background-color: #ff7675; color: white; font-size: 16px;" onclick="undo()">↩️</button>
            <button class="btn" style="background-color: #ffeaa7;" onclick="clearAll()">🗑️</button>
            <button id="tool-pen" class="btn active" onclick="setMode('pen')">✏️</button>
            <button id="tool-eraser" class="btn" onclick="setMode('eraser')">🧼</button>

            <div class="slider-box">
                <span>굵기</span>
                <input type="range" id="penSize" class="size-slider" min="2" max="35" value="6" oninput="updateSize(this.value)">
            </div>
        </div>

        <!-- 2. 중앙 손톱 캔버스 -->
        <div class="artboard">
            <div id="nailBackground"></div>
            <canvas id="paintCanvas" width="450" height="550"></canvas>

            <svg class="finger-overlay" viewBox="0 0 450 550">
                <defs>
                    <mask id="nail-hole">
                        <rect width="450" height="550" fill="white" />
                        <path d="M 100 110 C 100 45, 350 45, 350 110 L 335 380 C 335 415, 115 415, 115 380 Z" fill="black" />
                    </mask>
                    <clipPath id="nail-clip">
                        <path d="M 100 110 C 100 45, 350 45, 350 110 L 335 380 C 335 415, 115 415, 115 380 Z" />
                    </clipPath>
                    <filter id="blur-glow">
                        <feGaussianBlur stdDeviation="4" />
                    </filter>
                    <filter id="blur-shadow">
                        <feGaussianBlur stdDeviation="6" />
                    </filter>
                </defs>

                <!-- 손가락 피부 -->
                <g mask="url(#nail-hole)">
                    <rect width="450" height="550" fill="#f3edf5" />
                    <path d="M 0 550 C 20 420, 50 240, 60 115 C 60 20, 390 20, 390 115 C 400 240, 430 420, 450 550 Z" fill="#fbc5b1" stroke="#e09985" stroke-width="2.5" />
                </g>

                <!-- 3D 손톱 그림자 & 하이라이트 -->
                <g clip-path="url(#nail-clip)">
                    <path d="M 100 110 C 100 45, 350 45, 350 110 L 335 380 C 335 415, 115 415, 115 380 Z" fill="none" stroke="black" stroke-width="25" filter="url(#blur-shadow)" opacity="0.35" transform="translate(10, 10)" />
                    <path d="M 100 110 C 100 45, 350 45, 350 110 L 335 380 C 335 415, 115 415, 115 380 Z" fill="none" stroke="white" stroke-width="20" filter="url(#blur-glow)" opacity="0.95" transform="translate(-8, -8)" />
                </g>

                <!-- 손가락 주름 -->
                <path d="M 115 380 C 115 415, 335 415, 335 380" fill="none" stroke="#d18671" stroke-width="3" stroke-linecap="round" />
                <path d="M 70 460 C 125 475, 325 475, 380 460" fill="none" stroke="#e09985" stroke-width="2" stroke-linecap="round" opacity="0.8" />
            </svg>
        </div>

        <!-- 3. 하단 메뉴 바 -->
        <div class="right-menu">
            <!-- ✏️ 연필 색상 -->
            <div class="menu-column">
                <span class="column-title">✏️ 연필 색상 (👉 옆으로 스크롤)</span>
                <div class="color-row">
                    <button class="btn pen-color-btn selected" style="background: #e84393;" onclick="setPenColor('#e84393', this)"></button>
                    <button class="btn pen-color-btn" style="background: #ff80ab;" onclick="setPenColor('#ff80ab', this)"></button>
                    <button class="btn pen-color-btn" style="background: #ff7675;" onclick="setPenColor('#ff7675', this)"></button>
                    <button class="btn pen-color-btn" style="background: #ffbe76;" onclick="setPenColor('#ffbe76', this)"></button>
                    <button class="btn pen-color-btn" style="background: #ffeaa7;" onclick="setPenColor('#ffeaa7', this)"></button>
                    <button class="btn pen-color-btn" style="background: #b8e994;" onclick="setPenColor('#b8e994', this)"></button>
                    <button class="btn pen-color-btn" style="background: #55efc4;" onclick="setPenColor('#55efc4', this)"></button>
                    <button class="btn pen-color-btn" style="background: #81ecec;" onclick="setPenColor('#81ecec', this)"></button>
                    <button class="btn pen-color-btn" style="background: #74b9ff;" onclick="setPenColor('#74b9ff', this)"></button>
                    <button class="btn pen-color-btn" style="background: #a29bfe;" onclick="setPenColor('#a29bfe', this)"></button>
                    <button class="btn pen-color-btn" style="background: #2d3436;" onclick="setPenColor('#2d3436', this)"></button>
                    <button class="btn pen-color-btn" style="background: #ffffff; border: 3px solid #ddd;" onclick="setPenColor('#ffffff', this)"></button>
                </div>
            </div>

            <!-- 💅 바탕 매니큐어 -->
            <div class="menu-column">
                <span class="column-title">💅 바탕 매니큐어</span>
                <div class="color-row">
                    <button class="btn" style="background: linear-gradient(to bottom, #ff7675, #ffeaa7, #74b9ff);" onclick="fillPattern('rainbow')">🌈</button>
                    <button class="btn" style="background: radial-gradient(#fff 20%, #fd79a8 21%) 0 0 / 14px 14px;" onclick="fillPattern('dots')">🔮</button>
                    <button class="btn" style="background: repeating-linear-gradient(45deg, #ff9a9e, #ff9a9e 15px, #fecfef 15px, #fecfef 30px);" onclick="fillPattern('stripes')">🍬</button>
                    <button class="btn" style="background: #e84393;" onclick="fillPattern('color', '#e84393')"></button>
                    <button class="btn" style="background: #ff80ab;" onclick="fillPattern('color', '#ff80ab')"></button>
                    <button class="btn" style="background: #ffbe76;" onclick="fillPattern('color', '#ffbe76')"></button>
                    <button class="btn" style="background: #ffeaa7;" onclick="fillPattern('color', '#ffeaa7')"></button>
                    <button class="btn" style="background: #81ecec;" onclick="fillPattern('color', '#81ecec')"></button>
                    <button class="btn" style="background: #74b9ff;" onclick="fillPattern('color', '#74b9ff')"></button>
                    <button class="btn" style="background: #fff; font-weight:bold; font-size:14px;" onclick="fillPattern('clear')">지움</button>
                </div>
            </div>

            <!-- ⭐ 스티커 -->
            <div class="menu-column">
                <span class="column-title">✨ 귀여운 스티커</span>
                <div class="sticker-slider">
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🍎')">🍎</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🍑')">🍑</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🐬')">🐬</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🌷')">🌷</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🧸')">🧸</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🐥')">🐥</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '💖')">💖</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🎀')">🎀</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🌸')">🌸</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🍓')">🍓</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🍭')">🍭</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🍦')">🍦</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '⭐')">⭐</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '💎')">💎</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '👑')">👑</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🦄')">🦄</div>
                    <div class="btn sticker-item" onpointerdown="startDrag(event, '🐰')">🐰</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const sizeInput = document.getElementById('penSize');
        const nailBg = document.getElementById('nailBackground');

        let isDrawing = false;
        let currentMode = 'pen';
        let currentColor = '#e84393';

        let undoStack = [];
        const maxUndo = 15;

        let dragGhost = null;
        let draggedSticker = '';
        let initialPointerX = 0;
        let initialPointerY = 0;
        let potentialSticker = null;
        let isDraggingSticker = false;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = sizeInput.value;
        ctx.strokeStyle = currentColor;

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function getEmojiSize() {
            return parseInt(sizeInput.value) * 1.5 + 34;
        }

        function saveState() {
            if (undoStack.length >= maxUndo) undoStack.shift();
            undoStack.push(canvas.toDataURL());
        }

        function undo() {
            if (undoStack.length === 0) return;
            let previousState = undoStack.pop();
            let img = new Image();
            img.src = previousState;
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tool-pen').classList.remove('active');
            document.getElementById('tool-eraser').classList.remove('active');

            if (mode === 'pen') {
                document.getElementById('tool-pen').classList.add('active');
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = sizeInput.value;
            } else if (mode === 'eraser') {
                document.getElementById('tool-eraser').classList.add('active');
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = Math.max(parseInt(sizeInput.value) * 2.5, 20);
            }
        }

        function setPenColor(color, btnEl) {
            currentColor = color;
            setMode('pen');
            document.querySelectorAll('.pen-color-btn').forEach(btn => btn.classList.remove('selected'));
            if (btnEl) btnEl.classList.add('selected');
        }

        function updateSize(value) {
            if (currentMode === 'pen') {
                ctx.lineWidth = value;
            } else {
                ctx.lineWidth = Math.max(parseInt(value) * 2.5, 20);
            }
        }

        function fillPattern(type, arg = '') {
            if (type === 'color') {
                nailBg.style.background = arg;
            } else if (type === 'rainbow') {
                nailBg.style.background = 'linear-gradient(to bottom, #ff7675, #ffeaa7, #74b9ff)';
            } else if (type === 'dots') {
                nailBg.style.background = 'radial-gradient(#fff 20%, #fd79a8 21%) 0 0 / 14px 14px';
            } else if (type === 'stripes') {
                nailBg.style.background = 'repeating-linear-gradient(45deg, #ff9a9e, #ff9a9e 15px, #fecfef 15px, #fecfef 30px)';
            } else if (type === 'clear') {
                nailBg.style.background = 'radial-gradient(circle, #ffffff, #f7d6e0)';
            }
        }

        function clearAll() {
            saveState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function startDrag(e, sticker) {
            if (dragGhost) return;

            potentialSticker = sticker;
            isDraggingSticker = false;
            initialPointerX = e.clientX;
            initialPointerY = e.clientY;

            if (e.pointerType === 'mouse') {
                startActualDrag(e);
                window.addEventListener('pointerup', onDrop, { once: true });
                return;
            }

            window.addEventListener('pointermove', checkDragIntent, { passive: false });
            window.addEventListener('pointerup', cancelDragIntent, { once: true });
            window.addEventListener('pointercancel', cancelDragIntent, { once: true });
        }

        function startActualDrag(e) {
            isDraggingSticker = true;
            if (e.cancelable !== false) e.preventDefault();

            draggedSticker = potentialSticker;
            dragGhost = document.createElement('div');
            dragGhost.className = 'drag-ghost';
            dragGhost.innerText = draggedSticker;

            const size = getEmojiSize();
            dragGhost.style.fontSize = `${size}px`;
            dragGhost.style.left = `${e.clientX}px`;
            dragGhost.style.top = `${e.clientY}px`;
            document.body.appendChild(dragGhost);

            window.removeEventListener('pointermove', checkDragIntent);
            window.addEventListener('pointermove', onDrag, { passive: false });
        }

        function checkDragIntent(e) {
            if (!potentialSticker) return;

            let dx = Math.abs(e.clientX - initialPointerX);
            let dy = Math.abs(e.clientY - initialPointerY);

            if (!isDraggingSticker) {
                if (dy > 8 && dy > dx) {
                    startActualDrag(e);
                    window.addEventListener('pointerup', onDrop, { once: true });
                } else if (dx > 8 && dx >= dy) {
                    cancelDragIntent();
                }
            }
        }

        function cancelDragIntent() {
            potentialSticker = null;
            isDraggingSticker = false;
            window.removeEventListener('pointermove', checkDragIntent);
        }

        function onDrag(e) {
            if (!dragGhost) return;
            e.preventDefault();
            dragGhost.style.left = `${e.clientX}px`;
            dragGhost.style.top = `${e.clientY}px`;
        }

        function onDrop(e) {
            if (!dragGhost) return;

            window.removeEventListener('pointermove', onDrag);

            const rect = canvas.getBoundingClientRect();

            if (e.clientX >= rect.left && e.clientX <= rect.right &&
                e.clientY >= rect.top && e.clientY <= rect.bottom) {

                const coords = getCanvasCoords(e.clientX, e.clientY);

                saveState();
                ctx.globalCompositeOperation = 'source-over';

                const size = getEmojiSize();
                ctx.font = `${size}px 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(draggedSticker, coords.x, coords.y);
            }

            if (dragGhost.parentNode) {
                dragGhost.parentNode.removeChild(dragGhost);
            }
            dragGhost = null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            saveState();
            isDrawing = true;
            ctx.beginPath();
            const coords = getCanvasCoords(e.clientX, e.clientY);
            ctx.moveTo(coords.x, coords.y);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const coords = getCanvasCoords(e.clientX, e.clientY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', () => isDrawing = false);
        canvas.addEventListener('pointerleave', () => isDrawing = false);
        canvas.addEventListener('pointercancel', () => isDrawing = false);
    </script>
</body>

</html>
