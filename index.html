<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>재미있는 글자 공부</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        :root {
            --primary-bg: #f0f4f8;
            --card-number-bg: #4fc3f7;
            /* Light Blue */
            --card-number-shadow: #0288d1;
            --card-consonant-bg: #81c784;
            /* Light Green */
            --card-consonant-shadow: #388e3c;
            --card-vowel-bg: #ffb74d;
            /* Orange */
            --card-vowel-shadow: #f57c00;
            --card-alpha-bg: #f06292;
            /* Pink */
            --card-alpha-shadow: #c2185b;
            --text-color: #37474f;
        }

        body {
            font-family: 'Jua', sans-serif;
            background-color: var(--primary-bg);
            background-image: radial-gradient(#e1e8ed 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding: 0 0 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 📌 상단 고정 네비게이션 메뉴 */
        .top-nav {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            padding: 12px 0;
            margin-bottom: 25px;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        /* 스크롤바 숨기기 */
        .nav-container::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.1em;
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }

        .nav-btn.home { background-color: #78909c; }
        .nav-btn.num { background-color: var(--card-number-bg); }
        .nav-btn.kor { background-color: var(--card-consonant-bg); }
        .nav-btn.vowel { background-color: var(--card-vowel-bg); }
        .nav-btn.abc { background-color: var(--card-alpha-bg); }
        .nav-btn.play { background-color: #ec407a; }
        .nav-btn.game { background-color: #ab47bc; }
        .nav-btn.block { background-color: #ff7043; } /* 🧩 새 블록 맞추기 버튼 색상 */

        h1 {
            font-size: 3em;
            color: #263238;
            margin-top: 10px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0, 0, 0, 0.1);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 90%;
            max-width: 600px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            aspect-ratio: 1 / 1.1;
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .card-icon {
            font-size: 3em;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.05);
            white-space: nowrap;
        }

        .card-title {
            font-size: 2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Specific Card Styles */
        .card.number {
            background-color: var(--card-number-bg);
            box-shadow: 0 15px 0 var(--card-number-shadow), 0 25px 20px rgba(0, 0, 0, 0.1);
        }

        .card.number:active {
            box-shadow: 0 5px 0 var(--card-number-shadow), 0 10px 10px rgba(0, 0, 0, 0.1);
            transform: translateY(10px);
        }

        .card.consonant {
            background-color: var(--card-consonant-bg);
            box-shadow: 0 15px 0 var(--card-consonant-shadow), 0 25px 20px rgba(0, 0, 0, 0.1);
        }

        .card.consonant:active {
            box-shadow: 0 5px 0 var(--card-consonant-shadow), 0 10px 10px rgba(0, 0, 0, 0.1);
            transform: translateY(10px);
        }

        .card.vowel {
            background-color: var(--card-vowel-bg);
            box-shadow: 0 15px 0 var(--card-vowel-shadow), 0 25px 20px rgba(0, 0, 0, 0.1);
        }

        .card.vowel:active {
            box-shadow: 0 5px 0 var(--card-vowel-shadow), 0 10px 10px rgba(0, 0, 0, 0.1);
            transform: translateY(10px);
        }

        .card.alphabet {
            background-color: var(--card-alpha-bg);
            box-shadow: 0 15px 0 var(--card-alpha-shadow), 0 25px 20px rgba(0, 0, 0, 0.1);
        }

        .card.alphabet:active {
            box-shadow: 0 5px 0 var(--card-alpha-shadow), 0 10px 10px rgba(0, 0, 0, 0.1);
            transform: translateY(10px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.2em;
            }

            .grid-container {
                gap: 20px;
            }

            .card {
                padding: 20px 10px;
            }

            .card-icon {
                width: 80px;
                height: 80px;
                font-size: 2em;
            }

            .card-title {
                font-size: 1.5em;
            }

            .nav-container {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- 📌 상단 카테고리 메뉴 바 -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-btn home">🏠 메인</a>
            <a href="number.html" class="nav-btn num">🔢 숫자</a>
            <a href="KoreanConsonants.html" class="nav-btn kor">🇰🇷 자음</a>
            <a href="KoreanVowels.html" class="nav-btn vowel">🍦 모음</a>
            <a href="Alphabet.html" class="nav-btn abc">🔤 알파벳</a>
            <a href="nail.html" class="nav-btn play">💅 네일아트</a>
            <a href="calc.html" class="nav-btn num">🧮 수학놀이</a>
            <a href="game.html" class="nav-btn game">🎮 재미있는 게임</a>
            <!-- ✨ 새로 추가된 블록 맞추기 상단 메뉴 -->
            <a href="block.html" class="nav-btn block">🧩 블록 맞추기</a>
        </div>
    </nav>

    <h1>무엇을 공부할까요?</h1>

    <div class="grid-container">

        <!-- 그림 자음 -->
        <a href="KoreanConsonantsFun.html" class="card consonant"
            style="background-color: #66bb6a; box-shadow: 0 15px 0 #2e7d32, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">🦒</div>
            <div class="card-title">그림 자음</div>
        </a>

        <!-- 그림 모음 -->
        <a href="KoreanVowelsFun.html" class="card vowel"
            style="background-color: #ff9800; box-shadow: 0 15px 0 #e65100, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">🍦</div>
            <div class="card-title">그림 모음</div>
        </a>

        <!-- 그림 알파벳 대문자 -->
        <a href="AlphabetFun.html" class="card alphabet">
            <div class="card-icon">ABC</div>
            <div class="card-title">그림 알파벳 대문자</div>
        </a>

        <!-- 그림 알파벳 소문자 -->
        <a href="AlphabetSmallFun.html" class="card alphabet">
            <div class="card-icon">abc</div>
            <div class="card-title">그림 알파벳 소문자</div>
        </a>

        <!-- 네일아트 -->
        <a href="nail.html" class="card alphabet"
            style="background-color: #ec407a; box-shadow: 0 15px 0 #c2185b, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">💅</div>
            <div class="card-title">네일아트</div>
        </a>

        <!-- 수학 놀이터 -->
        <a href="calc.html" class="card number"
            style="background-color: #00cec9; box-shadow: 0 15px 0 #00b894, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">🧮</div>
            <div class="card-title">더하기 빼기 놀이</div>
        </a>

        <!-- 짝 맞추기 -->
        <a href="game.html" class="card"
            style="background-color: #ab47bc; box-shadow: 0 15px 0 #7b1fa2, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">🎮</div>
            <div class="card-title">짝 맞추기</div>
        </a>

        <!-- 카드 뒤집기 -->
        <a href="game2.html" class="card"
            style="background-color: #ab47bc; box-shadow: 0 15px 0 #7b1fa2, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">🎮</div>
            <div class="card-title">카드 뒤집기</div>
        </a>

        <!-- ✨ 새로 추가된 블록 맞추기 카드 -->
        <a href="block.html" class="card"
            style="background-color: #ff7043; box-shadow: 0 15px 0 #d84315, 0 25px 20px rgba(0, 0, 0, 0.1);">
            <div class="card-icon">🧩</div>
            <div class="card-title">블록 맞추기</div>
        </a>
    </div>

</body>

</html>
