<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 알록달록 이모지 수학 놀이터</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #a8edd9, #fed6e3);
            margin: 0;
            padding: 12px;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Mode Selector */
        .mode-tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 15px;
            background: #f1f2f6;
            font-weight: bold;
            font-size: 15px;
            color: #777;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ff7675;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 118, 117, 0.4);
        }

        /* Score Display */
        .score-board {
            font-size: 16px;
            font-weight: bold;
            color: #2d3436;
            background: #ffeaa7;
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* Question Header */
        .question-text {
            font-size: 22px;
            font-weight: bold;
            color: #2d3436;
            margin: 4px 0;
        }

        /* Visual Math Playground Area */
        .visual-area {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #f7f9fc;
            border: 3px dashed #74b9ff;
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            min-height: 140px;
        }

        .emoji-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
            padding: 6px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 15px;
        }

        .item-emoji {
            font-size: 36px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
            display: inline-block;
        }

        .item-emoji:active {
            transform: scale(1.3);
        }

        /* Subtraction Popped State */
        .item-emoji.popped {
            opacity: 0.2;
            transform: scale(0.7);
            filter: grayscale(100%);
            position: relative;
        }

        .operator-icon {
            font-size: 28px;
            font-weight: bold;
            color: #ff7675;
            margin: 0 4px;
        }

        .guide-msg {
            font-size: 13px;
            color: #0984e3;
            font-weight: bold;
        }

        /* Choice Buttons */
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .choice-btn {
            background: white;
            border: 3px solid #74b9ff;
            border-radius: 20px;
            padding: 14px;
            font-size: 26px;
            font-weight: bold;
            color: #0984e3;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.05);
            transition: transform 0.1s, background-color 0.15s;
        }

        .choice-btn:active {
            transform: scale(0.95);
            background-color: #74b9ff;
            color: white;
        }

        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Modal Popup for Feedback */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }

        .feedback-card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            animation: popIn 0.3s ease;
            max-width: 300px;
        }

        .feedback-card h3 {
            font-size: 32px;
            margin: 0 0 10px 0;
        }

        .feedback-card p {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }

        .next-btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .home-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: white;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .home-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <a href="index.html" class="home-btn">🏠 홈으로</a>

    <div class="game-card">
        <!-- 모드 선택 -->
        <div class="mode-tabs">
            <button class="tab-btn active" onclick="setMode('add', this)">➕ 더하기</button>
            <button class="tab-btn" onclick="setMode('sub', this)">➖ 빼기</button>
            <button class="tab-btn" onclick="setMode('mix', this)">🎲 섞어서</button>
        </div>

        <!-- 스탬프 점수 -->
        <div class="score-board" id="scoreBoard">⭐ 참 잘했어요: 0개</div>

        <!-- 문제 텍스트 -->
        <div class="question-text" id="questionText">3 + 2 = ?</div>
        <div class="guide-msg" id="guideMsg">이모지를 터치하며 개수를 세어보세요!</div>

        <!-- 시각적 시뮬레이션 영역 -->
        <div class="visual-area" id="visualArea"></div>

        <!-- 보기 선택 버튼 -->
        <div class="choices-grid" id="choicesGrid"></div>
    </div>

    <!-- 정답 모달 -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <h3 id="feedbackEmoji">🎉</h3>
            <p id="feedbackText">정답이에요!</p>
            <button class="next-btn" onclick="nextQuestion()">다음 문제 ➡️</button>
        </div>
    </div>

    <script>
        const emojiSet = ['🍎', '🍓', '🐥', '🧸', '🍭', '🍦', '🍩', '🦋', '🌸', '⭐', '🎈', '🍪'];

        let currentMode = 'add'; // 'add', 'sub', 'mix'
        let num1 = 0, num2 = 0, answer = 0;
        let currentOp = '+';
        let score = 0;
        let currentEmoji = '🍎';
        let isAnswered = false; // 연타 방지 플래그

        // 싱글톤 오디오 컨텍스트
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.onended = () => {
                    osc.disconnect();
                    gain.disconnect();
                };

                const now = audioCtx.currentTime;
                if (type === 'pop') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'wrong') {
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(160, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) { }
        }

        function setMode(mode, btnEl) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            generateQuestion();
        }

        function generateQuestion() {
            isAnswered = false; // 연타 잠금 해제
            currentEmoji = emojiSet[Math.floor(Math.random() * emojiSet.length)];

            let isAdd = true;
            if (currentMode === 'add') isAdd = true;
            else if (currentMode === 'sub') isAdd = false;
            else isAdd = Math.random() > 0.5;

            currentOp = isAdd ? '+' : '-';

            if (isAdd) {
                num1 = Math.floor(Math.random() * 5) + 1; // 1~5
                num2 = Math.floor(Math.random() * 5) + 1; // 1~5
                answer = num1 + num2;
                document.getElementById('guideMsg').innerText = '✨ 이모지를 터치하며 합쳐진 개수를 세어보세요!';
            } else {
                // 빼기 문제 범위를 4~10으로 확대하여 다양한 조합 생성
                num1 = Math.floor(Math.random() * 7) + 4; // 4~10
                num2 = Math.floor(Math.random() * (num1 - 2)) + 1; // 1 ~ (num1-2) 로 설정하여 빼는 수 다양화
                answer = num1 - num2;
                document.getElementById('guideMsg').innerText = `💥 이모지를 ${num2}개 터치해서 톡! 터뜨려보세요!`;
            }

            document.getElementById('questionText').innerText = `${num1} ${currentOp} ${num2} = ?`;

            renderVisuals();
            renderChoices();
        }

        function renderVisuals() {
            const container = document.getElementById('visualArea');
            container.innerHTML = '';

            if (currentOp === '+') {
                const group1 = document.createElement('div');
                group1.className = 'emoji-group';
                for (let i = 0; i < num1; i++) {
                    group1.appendChild(createEmojiEl());
                }

                const op = document.createElement('span');
                op.className = 'operator-icon';
                op.innerText = '+';

                const group2 = document.createElement('div');
                group2.className = 'emoji-group';
                for (let i = 0; i < num2; i++) {
                    group2.appendChild(createEmojiEl());
                }

                container.appendChild(group1);
                container.appendChild(op);
                container.appendChild(group2);
            } else {
                const group = document.createElement('div');
                group.className = 'emoji-group';
                for (let i = 0; i < num1; i++) {
                    const el = createEmojiEl();
                    el.onclick = function () {
                        playSound('pop');
                        this.classList.toggle('popped');
                    };
                    group.appendChild(el);
                }
                container.appendChild(group);
            }
        }

        function createEmojiEl() {
            const span = document.createElement('span');
            span.className = 'item-emoji';
            span.innerText = currentEmoji;
            span.onclick = function () {
                playSound('pop');
                this.style.transform = 'scale(1.3)';
                setTimeout(() => this.style.transform = 'none', 120);
            };
            return span;
        }

        // 반복문(while) 없이 100% 안전하게 4개의 보기를 생성하는 로직
        function renderChoices() {
            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = '';

            const candidates = new Set();
            
            // 정답 근처 오답 후보 추가
            [-3, -2, -1, 1, 2, 3, 4, 5].forEach(offset => {
                let val = answer + offset;
                if (val > 0 && val !== answer) {
                    candidates.add(val);
                }
            });

            // 기본 1~10 수 백업 추가
            for (let i = 1; i <= 10; i++) {
                if (i !== answer) candidates.add(i);
            }

            // 무작위로 3개 추출 후 정답과 섞기
            const wrongList = Array.from(candidates).sort(() => Math.random() - 0.5).slice(0, 3);
            const finalChoices = [answer, ...wrongList].sort(() => Math.random() - 0.5);

            finalChoices.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = val;
                btn.onclick = () => checkAnswer(val);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (isAnswered) return; // 연타 방지
            isAnswered = true;

            const overlay = document.getElementById('feedbackOverlay');
            const emojiEl = document.getElementById('feedbackEmoji');
            const textEl = document.getElementById('feedbackText');

            if (selected === answer) {
                playSound('correct');
                score++;
                document.getElementById('scoreBoard').innerText = `⭐ 참 잘했어요: ${score}개`;
                emojiEl.innerText = '🎉';
                textEl.innerText = '정답이에요! 잘했어요!';
            } else {
                playSound('wrong');
                emojiEl.innerText = '😅';
                textEl.innerText = '아쉬워요! 다시 차근차근 세어볼까요?';
            }
            overlay.style.display = 'flex';
        }

        function nextQuestion() {
            document.getElementById('feedbackOverlay').style.display = 'none';
            generateQuestion();
        }

        // 초기 시작
        generateQuestion();
    </script>
</body>

</html>
